[package]
name = "viewpoint-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytes = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
xcap = "0.9"
openh264 = "0.9"
webrtc = "0.20"
rtc = "=0.20.5"
async-trait = "0.1"
rand = "0.8"
env_logger = "0.11"
log = "0.4"
wasapi = { version = "0.24", optional = true }

[features]
default = []
audio = ["wasapi"]
