<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewpoint</title>
    <link rel="icon" href="data:,">

    <style>
      :root {
        --accent: #4ade80;
        --danger: #f87171;
        --amber: #fbbf24;
        --pill: rgba(12, 14, 18, 0.72);
        --stroke: rgba(255, 255, 255, 0.10);
        --text: #e8eaed;
        --dim: #9aa0a6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          120% 100% at 50% 0%,
          #101318 0%,
          #000 60%
        );
      }

      #screen {
        position: relative;
        z-index: 1;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
      }

      #status {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 8px 10px;
        border-radius: 999px;
        background: var(--pill);
        border: 1px solid var(--stroke);
        color: var(--text);
        font-size: 13px;
        letter-spacing: 0.04em;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        user-select: none;
      }

      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        flex: none;
      }

      #status[data-state="live"] #dot {
        background: var(--accent);
      }

      #status[data-state="failed"] #dot {
        background: var(--danger);
        box-shadow: 0 0 8px var(--danger);
      }

      #status[data-state="paused"] #dot {
        background: var(--amber);
      }

      #brand {
        position: fixed;
        top: 16px;
        right: 18px;
        z-index: 100;
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        user-select: none;
      }

      #controls {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px;
        background: var(--pill);
        border: 1px solid var(--stroke);
        border-radius: 999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 0.35s ease, translate 0.35s ease;
      }

      #controls[hidden] {
        display: none;
      }

      body.idle #controls {
        opacity: 0;
        pointer-events: none;
        translate: 0 8px;
      }

      #controls button {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        background: transparent;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
      }

      #controls button:hover {
        background: rgba(255, 255, 255, 0.10);
      }

      #controls button svg {
        width: 15px;
        height: 15px;
        flex: none;
      }

      #controls .divider {
        width: 1px;
        height: 18px;
        background: var(--stroke);
        margin: 0 3px;
      }

      #retry {
        color: var(--amber);
      }
    </style>
  </head>

  <body>
    <div id="stage"></div>

    <video
      id="screen"
      autoplay
      playsinline
      muted></video>

    <div id="status" data-state="connecting">
      <span id="dot"></span>
      <span id="statusText">Connecting</span>
    </div>

    <div id="brand">Viewpoint</div>

    <div id="controls" hidden>
      <button
        id="pause"
        type="button"
        title="Pause / resume">
        <svg
          id="pauseIcon"
          viewBox="0 0 16 16"
          fill="currentColor">
          <rect
            x="2.5"
            y="2"
            width="4"
            height="12"
            rx="1" />
          <rect
            x="9.5"
            y="2"
            width="4"
            height="12"
            rx="1" />
        </svg>

        <span id="pauseLabel">Pause</span>
      </button>

      <div class="divider"></div>

      <button
        id="mute"
        type="button"
        title="Mute / unmute">
        <svg
          viewBox="0 0 16 16"
          fill="currentColor">
          <path d="M2 6v4h3l4 3.5v-11L5 6H2z" />

          <path
            id="muteWaves"
            d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8"
            stroke="currentColor"
            stroke-width="1.4"
            fill="none"
            stroke-linecap="round" />
        </svg>

        <span id="muteLabel">Unmute</span>
      </button>

      <div
        class="divider"
        id="retryDivider"
        hidden></div>

      <button
        id="retry"
        type="button"
        hidden
        title="Reload and retry">
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3" />
        </svg>

        <span>Retry</span>
      </button>
    </div>

    <script
      type="module"
      src="/app.js"></script>
  </body>
</html>
